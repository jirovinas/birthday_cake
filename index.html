<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Ma'am Ladyanne! 🎂</title>
  <style>
    /* ==========================================
       RESET & BASE STYLES
       ========================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 50%, #7dd3fc 100%);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow-x: hidden;
      color: #0c4a6e;
      padding: 10px 10px 20px 10px;
      position: relative;
    }

    /* Ambient Background Effects */
    .bg-effects-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .bg-flake {
      position: absolute;
      border-radius: 50%;
      opacity: 0.4;
      animation: floatFlake 8s infinite linear;
    }

    .side-sparkle {
      position: absolute;
      background: radial-gradient(circle, #ffffff 0%, #fef08a 70%, transparent 100%);
      border-radius: 50%;
      opacity: 0.6;
      filter: drop-shadow(0 0 6px #fef08a);
      animation: floatSparkle 6s infinite ease-in-out alternate;
    }

    .side-bokeh {
      position: absolute;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      backdrop-filter: blur(4px);
      box-shadow: 0 0 15px rgba(254, 240, 138, 0.3);
      animation: floatBokeh 9s infinite ease-in-out alternate;
    }

    /* ==========================================
       2-TIER CURVED BUNTING BANNER
       ========================================== */
    .bunting-header {
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin-top: 5px;
      z-index: 25;
      opacity: 0;
      animation: fadeIn 1.2s ease-out forwards;
    }

    .bunting-row {
      position: relative;
      width: 100%;
      height: 70px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .bunting-string-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 65px;
      overflow: visible;
      pointer-events: none;
    }

    .bunting-flags {
      position: absolute;
      top: 2px;
      width: 96%;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 3px;
      list-style: none;
      pointer-events: none;
    }

    .word-group {
      display: flex;
      gap: 3px;
    }

    .word-spacer {
      width: 10px;
    }

    .pennant-flag {
      position: relative;
      width: 28px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.85rem;
      color: #ffffff;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.4);
      clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 82%, 0 100%);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
      transform-origin: top center;
      flex-shrink: 0;
      transform: translateY(var(--curve-y, 0px)) rotate(var(--curve-r, 0deg));
      animation: flagSway 4s ease-in-out infinite alternate;
    }

    .pennant-flag.navy {
      background: linear-gradient(180deg, #0284c7 0%, #0369a1 100%);
      border-top: 3px solid #38bdf8;
    }

    .pennant-flag.gold {
      background: linear-gradient(180deg, #fef08a 0%, #eab308 100%);
      color: #713f12;
      text-shadow: none;
      border-top: 3px solid #fef08a;
    }

    .pennant-flag.star-flag {
      width: 30px;
      font-size: 0.9rem;
      background: linear-gradient(180deg, #fef08a 0%, #eab308 100%);
      border-top: 3px solid #ffffff;
      clip-path: polygon(0 0, 100% 0, 100% 88%, 50% 100%, 0 88%);
    }

    /* ==========================================
       HANGING POLAROID PHOTO GARLAND (UPSCALED)
       ========================================== */
    .garland-container {
      position: relative;
      width: 100%;
      max-width: 600px;
      height: 130px;
      z-index: 15;
      display: flex;
      justify-content: center;
      margin-top: 8px;
      margin-bottom: 4px;
    }

    .garland-string-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 65px;
      overflow: visible;
      pointer-events: none;
    }

    .polaroid-list {
      position: absolute;
      top: 10px;
      width: 90%;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      list-style: none;
      pointer-events: none;
    }

    .polaroid-card {
      background: #ffffff;
      padding: 6px 6px 16px 6px;
      border-radius: 5px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
      width: 88px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      transform-origin: top center;
      animation: polaroidSway 3.5s ease-in-out infinite alternate;
    }

    .polaroid-card::before {
      content: '';
      position: absolute;
      top: -9px;
      width: 10px;
      height: 15px;
      background: #eab308;
      border-radius: 2px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.25);
    }

    .polaroid-card img {
      width: 100%;
      height: 92px;
      object-fit: cover;
      background: #ffffff;
      border-radius: 3px;
    }

    .polaroid-1 { transform: rotate(-4deg); animation-delay: 0s; margin-top: 0px; }
    .polaroid-2 { transform: rotate(3deg); animation-delay: 0.5s; margin-top: 10px; }
    .polaroid-3 { transform: rotate(-3deg); animation-delay: 1s; margin-top: 10px; }
    .polaroid-4 { transform: rotate(5deg); animation-delay: 1.5s; margin-top: 0px; }

    /* ==========================================
       INSTRUCTION PROMPT
       ========================================== */
    .prompt-container {
      background: #0369a1;
      color: #ffffff;
      padding: 7px 18px;
      border-radius: 30px;
      font-size: 0.88rem;
      font-weight: 600;
      box-shadow: 0 4px 15px rgba(3, 105, 161, 0.3);
      border: 2px solid #38bdf8;
      opacity: 0;
      transition: opacity 0.6s ease, transform 0.3s ease;
      min-height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 30;
      margin-top: 6px;
      margin-bottom: 6px;
      text-align: center;
      position: relative;
    }

    .prompt-container.visible {
      opacity: 1;
      animation: pulsePill 2s infinite ease-in-out;
    }

    /* ==========================================
       ELEVATED BALLOONS & SIDE POLAROIDS
       ========================================== */
    .side-balloon-wrapper {
      position: fixed;
      top: 40px;
      z-index: 12;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.3s ease;
    }

    .side-balloon-wrapper.left {
      left: 2%;
      animation: floatBobLeft 5s ease-in-out infinite alternate;
    }

    .side-balloon-wrapper.right {
      right: 2%;
      animation: floatBobRight 5s ease-in-out 1.5s infinite alternate;
    }

    .side-balloon {
      position: relative;
      width: 100px;
      height: 135px;
      border-radius: 50% 50% 50% 50% / 55% 55% 45% 45%;
    }

    .side-balloon-wrapper.left .side-balloon {
      background: radial-gradient(circle at 35% 30%, #bae6fd, #0284c7);
      box-shadow: inset -6px -6px 15px rgba(3, 105, 161, 0.4), 0 12px 24px rgba(0,0,0,0.12);
    }

    .side-balloon-wrapper.right .side-balloon {
      background: radial-gradient(circle at 35% 30%, #fef08a, #eab308);
      box-shadow: inset -6px -6px 15px rgba(161, 98, 7, 0.4), 0 12px 24px rgba(0,0,0,0.12);
    }

    .side-balloon-knot {
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
    }

    .side-balloon-wrapper.left .side-balloon-knot { border-bottom: 10px solid #0284c7; }
    .side-balloon-wrapper.right .side-balloon-knot { border-bottom: 10px solid #eab308; }

    .balloon-string-upper-svg {
      width: 40px;
      height: 60px;
      overflow: visible;
    }

    .tied-polaroid-frame {
      position: relative;
      background: #ffffff;
      width: 250px;
      padding: 12px 12px 42px 12px;
      border-radius: 6px;
      box-shadow: 0 16px 32px rgba(15, 23, 42, 0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    .side-balloon-wrapper.left .tied-polaroid-frame {
      transform: rotate(-5deg);
    }

    .side-balloon-wrapper.right .tied-polaroid-frame {
      transform: rotate(5deg);
    }

    .pin-attachment {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 20px;
      background: #d97706;
      border-radius: 2px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
      z-index: 3;
    }

    .pin-attachment::after {
      content: '';
      position: absolute;
      top: 6px;
      left: 1px;
      width: 12px;
      height: 2px;
      background: #fef08a;
    }

    .tied-polaroid-frame img {
      width: 226px;
      height: 282px;
      object-fit: cover;
      background: #ffffff;
      border-radius: 3px;
    }

    .balloon-string-tail-svg {
      width: 50px;
      height: 120px;
      overflow: visible;
      margin-top: -4px;
    }

    /* ==========================================
       ELEVATED STAGE & CAKE ASSEMBLY
       ========================================== */
    .stage {
      position: relative;
      width: 100%;
      max-width: 420px;
      height: 265px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      z-index: 20;
    }

    .plate {
      position: absolute;
      bottom: 0px;
      width: 290px;
      height: 20px;
      background: linear-gradient(180deg, #fef08a 0%, #eab308 50%, #ca8a04 100%);
      border-radius: 12px;
      box-shadow: 0 12px 25px rgba(3, 105, 161, 0.3);
      opacity: 0;
      animation: fadeIn 1.2s ease-out 0.3s forwards;
      z-index: 2;
    }

    .plate::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3%;
      width: 94%;
      height: 4px;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 4px;
    }

    .cake-assembly {
      position: absolute;
      bottom: 18px;
      display: flex;
      flex-direction: column-reverse;
      align-items: center;
      width: 100%;
      z-index: 3;
    }

    .layer {
      position: relative;
      border-radius: 16px 16px 10px 10px;
      opacity: 0;
      border-bottom: 3px solid #eab308;
      filter: drop-shadow(0 8px 12px rgba(15, 23, 42, 0.18));
    }

    .layer-base {
      width: 230px;
      height: 68px;
      background-color: #0f172a;
      z-index: 4;
    }

    .layer-middle {
      width: 170px;
      height: 58px;
      background-color: #0284c7;
      margin-bottom: -4px;
      z-index: 5;
    }

    .layer-top {
      width: 115px;
      height: 48px;
      background-color: #e0f2fe;
      margin-bottom: -4px;
      z-index: 6;
    }

    .layer.drop {
      animation: dropIn 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .icing {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 16px;
      background-color: #ffffff;
      border-radius: 14px 14px 8px 8px;
    }

    .icing::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 3%;
      width: 94%;
      height: 8px;
      background: radial-gradient(circle, #ffffff 60%, transparent 65%);
      background-size: 14px 14px;
    }

    /* ==========================================
       CANDLE & FLAME INTERACTIVITY
       ========================================== */
    .decorations {
      position: absolute;
      top: -34px;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 34px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      opacity: 0;
      z-index: 10;
    }

    .decorations.pop-in {
      animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .candle {
      width: 12px;
      height: 32px;
      background: repeating-linear-gradient(45deg, #fef08a, #fef08a 5px, #0284c7 5px, #0284c7 10px);
      border-radius: 4px;
      position: relative;
    }

    .flame-container {
      position: absolute;
      top: -26px;
      left: 50%;
      transform: translateX(-50%);
      width: 44px;
      height: 44px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: manipulation;
      z-index: 40;
    }

    .flame {
      width: 14px;
      height: 22px;
      background: radial-gradient(circle at 50% 80%, #ffffff 10%, #fef08a 40%, #f97316 100%);
      border-radius: 50% 50% 20% 20%;
      animation: flicker 0.6s infinite alternate ease-in-out, flameGlow 1.8s infinite ease-in-out;
      transform-origin: center bottom;
      transition: transform 0.2s ease, opacity 0.3s ease;
    }

    .flame-container:hover .flame {
      transform: scale(1.35);
    }

    .spark {
      position: absolute;
      width: 24px;
      height: 24px;
      background: radial-gradient(circle, #ffffff 0%, #fef08a 60%, transparent 100%);
      border-radius: 50%;
      opacity: 0;
      pointer-events: none;
    }

    .spark.ignite {
      animation: sparkFlash 0.5s ease-out forwards;
    }

    .smoke {
      position: absolute;
      top: -5px;
      left: 50%;
      transform: translateX(-50%);
      width: 8px;
      height: 8px;
      background: rgba(200, 200, 200, 0.8);
      border-radius: 50%;
      opacity: 0;
      pointer-events: none;
    }

    .smoke.puff {
      animation: smokePuff 1s ease-out forwards;
    }

    .sprinkle {
      position: absolute;
      width: 6px;
      height: 3px;
      border-radius: 2px;
    }

    /* ==========================================
       CONFETTI CANVAS & MODAL
       ========================================== */
    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 90;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(6px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.6s ease, visibility 0.6s ease;
      z-index: 100;
      padding: 20px;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .card {
      background: #ffffff;
      padding: 35px 25px;
      border-radius: 24px;
      text-align: center;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.22);
      transform: translateY(30px) scale(0.95);
      transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border: 4px solid #bae6fd;
    }

    .modal-overlay.active .card {
      transform: translateY(0) scale(1);
    }

    .card h2 {
      color: #0369a1;
      margin-bottom: 12px;
      font-size: 1.6rem;
    }

    .card p {
      font-size: 1.05rem;
      line-height: 1.55;
      color: #475569;
      margin-bottom: 24px;
    }

    .replay-btn {
      display: inline-block;
      background: linear-gradient(180deg, #fef08a 0%, #eab308 100%);
      color: #713f12;
      padding: 14px 22px;
      border-radius: 14px;
      font-weight: 700;
      border: none;
      box-shadow: 0 5px 0 #ca8a04;
      font-size: 1rem;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      touch-action: manipulation;
    }

    .replay-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #ca8a04;
    }

    /* ==========================================
       KEYFRAME ANIMATIONS
       ========================================== */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes dropIn {
      0% { opacity: 0; transform: translateY(-450px); }
      70% { opacity: 1; transform: translateY(0); }
      85% { transform: translateY(-12px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes popIn {
      0% { opacity: 0; transform: translate(-50%, 10px) scale(0.5); }
      70% { opacity: 1; transform: translate(-50%, -5px) scale(1.15); }
      100% { opacity: 1; transform: translate(-50%, 0) scale(1); }
    }

    @keyframes flicker {
      0% { transform: scale(1) rotate(-3deg); }
      100% { transform: scale(1.15) rotate(3deg); }
    }

    @keyframes flameGlow {
      0%, 100% { filter: drop-shadow(0 0 6px #fef08a) drop-shadow(0 0 12px #f97316); }
      50% { filter: drop-shadow(0 0 14px #fef08a) drop-shadow(0 0 24px #f97316); }
    }

    @keyframes sparkFlash {
      0% { opacity: 0; transform: scale(0.2); }
      50% { opacity: 1; transform: scale(1.5); }
      100% { opacity: 0; transform: scale(2.2); }
    }

    @keyframes pulsePill {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }

    @keyframes smokePuff {
      0% { opacity: 0.9; transform: translateX(-50%) translateY(0) scale(1); }
      100% { opacity: 0; transform: translateX(-50%) translateY(-35px) scale(3.5); }
    }

    @keyframes floatBobLeft {
      0% { transform: translateY(0px) rotate(-2deg); }
      100% { transform: translateY(-20px) rotate(1deg); }
    }

    @keyframes floatBobRight {
      0% { transform: translateY(0px) rotate(2deg); }
      100% { transform: translateY(-20px) rotate(-1deg); }
    }

    @keyframes floatSparkle {
      0% { transform: translateY(0px) scale(0.8); opacity: 0.4; }
      100% { transform: translateY(-25px) scale(1.2); opacity: 0.8; }
    }

    @keyframes floatBokeh {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      100% { transform: translateY(-35px) translateX(15px); opacity: 0.5; }
    }

    @keyframes polaroidSway {
      0% { transform: rotate(-4deg); }
      100% { transform: rotate(4deg); }
    }

    @keyframes flagSway {
      0% { transform: translateY(var(--curve-y, 0px)) rotate(var(--curve-r, 0deg)); }
      100% { transform: translateY(calc(var(--curve-y, 0px) + 2px)) rotate(calc(var(--curve-r, 0deg) + 3deg)); }
    }

    @keyframes floatFlake {
      0% { transform: translateY(-10vh) rotate(0deg); }
      100% { transform: translateY(110vh) rotate(360deg); }
    }

    /* ==========================================
       RESPONSIVE DESIGN & MOBILE ADAPTATION
       ========================================== */
    @media (max-width: 1200px) {
      .side-balloon-wrapper { top: 30px; }
      .side-balloon { width: 80px; height: 110px; }
      .balloon-string-upper-svg { height: 50px; }
      .tied-polaroid-frame { width: 180px; padding: 10px 10px 32px 10px; }
      .tied-polaroid-frame img { width: 160px; height: 200px; }
      .balloon-string-tail-svg { height: 100px; }
    }

    /* Tablet & Medium Mobile Viewports */
    @media (max-width: 768px) {
      body {
        padding: 6px 4px 16px 4px;
      }

      .bunting-header {
        max-width: 100%;
        gap: 8px;
        transform: scale(0.85);
        transform-origin: top center;
        margin-bottom: -12px;
      }

      .pennant-flag {
        width: 22px;
        height: 38px;
        font-size: 0.72rem;
      }

      .pennant-flag.star-flag {
        width: 24px;
        font-size: 0.78rem;
      }

      .bunting-row {
        height: 52px;
      }

      .word-spacer {
        width: 4px;
      }

      .garland-container {
        max-width: 380px;
        height: 100px;
        margin-top: 2px;
        margin-bottom: 2px;
      }

      .garland-string-svg {
        height: 48px;
      }

      .polaroid-list {
        width: 94%;
        top: 6px;
      }

      .polaroid-card {
        width: 62px;
        padding: 4px 4px 12px 4px;
        border-radius: 4px;
      }

      .polaroid-card::before {
        top: -7px;
        width: 7px;
        height: 11px;
      }

      .polaroid-card img {
        height: 64px;
      }

      .side-balloon-wrapper {
        display: flex !important;
        top: 220px;
        z-index: 10;
      }

      .side-balloon-wrapper.left {
        left: 2%;
      }

      .side-balloon-wrapper.right {
        right: 2%;
      }

      .side-balloon {
        width: 50px;
        height: 68px;
      }

      .side-balloon-knot {
        bottom: -5px;
        border-left: 5px solid transparent;
        border-right: 5px solid transparent;
      }

      .side-balloon-wrapper.left .side-balloon-knot { border-bottom: 7px solid #0284c7; }
      .side-balloon-wrapper.right .side-balloon-knot { border-bottom: 7px solid #eab308; }

      .balloon-string-upper-svg {
        width: 24px;
        height: 25px;
      }

      .tied-polaroid-frame {
        width: 125px;
        padding: 6px 6px 22px 6px;
        border-radius: 4px;
        box-shadow: 0 8px 18px rgba(15, 23, 42, 0.2);
      }

      .pin-attachment {
        top: -7px;
        width: 10px;
        height: 14px;
      }

      .pin-attachment::after {
        top: 4px;
        width: 8px;
        height: 1.5px;
      }

      .tied-polaroid-frame img {
        width: 113px;
        height: 141px;
      }

      .balloon-string-tail-svg {
        width: 30px;

      .prompt-container {

    /* Small Mobile Viewports (<480px) Layout Refinements & Polish */
    @media (max-width: 480px) {
      body {
        padding: 4px 4px 12px 4px;
        justify-content: space-between;
      }

      /* Prevent Bunting Banner Edge Flags Clipping */
      .bunting-header {
        transform: scale(0.76);

        max-width: 100%;
        width: 100%;
        margin-bottom: 0px;

      .pennant-flag {

      .bunting-row {

      /* Fix Upper Garland Photo Visibility & Vertical Clearance */
      .garland-container {

        margin-bottom: 4px;

      .polaroid-list {

      /* Instruction Pill Spacing */

      /* Push Side Balloons & Polaroids Outer Towards Screen Edges */
      .side-balloon-wrapper {

      /* Compact Side Polaroid Dimensions */

</head>
<body>

  <!-- Floating Confetti & Side Fillers -->
  <div class="bg-effects-container" id="bg-effects"></div>

  <!-- 2-Tier Curved Bunting Banner Header -->

          <div class="pennant-flag navy" style="--curve-y: 13px; --curve-r: -5deg;">P</div>

    <!-- Row 2: MA'AM ⭐ LADYANNE -->
    <div class="bunting-row">
      <svg class="bunting-string-svg" viewBox="0 0 820 65" preserveAspectRatio="none">
        <path d="M0,5 Q410,60 820,5" fill="none" stroke="rgba(3,105,161,0.4)" stroke-width="2" stroke-dasharray="5,5"/>
      </svg>
      <div class="bunting-flags">
        <div class="word-group">
          <div class="pennant-flag gold" style="--curve-y: 2px; --curve-r: -10deg;">M</div>
          <div class="pennant-flag navy" style="--curve-y: 8px; --curve-r: -8deg;">A</div>
          <div class="pennant-flag gold" style="--curve-y: 13px; --curve-r: -6deg;">'</div>
          <div class="pennant-flag navy" style="--curve-y: 17px; --curve-r: -4deg;">A</div>
          <div class="pennant-flag gold" style="--curve-y: 20px; --curve-r: -2deg;">M</div>
        </div>
        <div class="word-spacer"></div>
        <div class="pennant-flag star-flag" style="--curve-y: 22px; --curve-r: 0deg;">⭐</div>

          <div class="pennant-flag gold" style="--curve-y: 9px; --curve-r: 8deg;">N</div>
          <div class="pennant-flag navy" style="--curve-y: 5px; --curve-r: 9deg;">N</div>

  <!-- Upper Hanging Polaroid Garland (Upscaled) -->
  <div class="garland-container">
    <svg class="garland-string-svg" viewBox="0 0 600 65" preserveAspectRatio="none">
      <path d="M0,5 Q300,55 600,5" fill="none" stroke="rgba(3,105,161,0.35)" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Instruction Prompt Pill -->
  <div class="prompt-container" id="prompt">
    Tap the flame to blow out your candle & make a wish! 🕯️
  </div>

  <!-- Left Side Balloon Assembly -->
  <div class="side-balloon-wrapper left">
    <div class="side-balloon">
      <div class="side-balloon-knot"></div>
    </div>
    <svg class="balloon-string-upper-svg" viewBox="0 0 40 60">
      <path d="M20,0 Q32,30 20,60" fill="none" stroke="rgba(3,105,161,0.45)" stroke-width="2"/>
    </svg>
    <div class="tied-polaroid-frame">
      <div class="pin-attachment"></div>
      <img src="l.jpg" alt="Featured Memory Left" />
    </div>
    <svg class="balloon-string-tail-svg" viewBox="0 0 50 220">
      <path d="M25,0 Q8,60 38,120 T20,220" fill="none" stroke="rgba(3,105,161,0.35)" stroke-width="2"/>
    </svg>
  </div>

  <!-- Right Side Balloon Assembly -->
  <div class="side-balloon-wrapper right">
    <div class="side-balloon">
      <div class="side-balloon-knot"></div>
    </div>
    <svg class="balloon-string-upper-svg" viewBox="0 0 40 60">
      <path d="M20,0 Q8,30 20,60" fill="none" stroke="rgba(161,98,7,0.45)" stroke-width="2"/>
    </svg>
    <div class="tied-polaroid-frame">
      <div class="pin-attachment"></div>
      <img src="r.jpg" alt="Featured Memory Right" />
    </div>
    <svg class="balloon-string-tail-svg" viewBox="0 0 50 220">
      <path d="M25,0 Q42,60 12,120 T30,220" fill="none" stroke="rgba(161,98,7,0.35)" stroke-width="2"/>
    </svg>
  </div>

  <!-- Stage Area for Cake Assembly -->
  <main class="stage">
    <div class="cake-assembly">
      <!-- Base Layer (Navy) -->
      <div class="layer layer-base" id="layer-base">
        <div class="icing"></div>
      </div>

      <!-- Middle Layer (Sapphire) -->
      <div class="layer layer-middle" id="layer-middle">
        <div class="icing"></div>
      </div>

      <!-- Top Layer (Ice Blue) -->
      <div class="layer layer-top" id="layer-top">
        <div class="icing"></div>

        <!-- Candle & Flame -->
        <div class="decorations" id="decorations">
          <div class="candle">
            <div class="flame-container" id="flame-container">
              <div class="flame" id="flame"></div>
              <div class="spark" id="spark"></div>
              <div class="smoke" id="smoke"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Golden Plate -->
    <div class="plate"></div>
  </main>

  <!-- Confetti Canvas -->
  <canvas id="confetti-canvas"></canvas>

  <!-- Replayable Birthday Card Modal -->
  <div class="modal-overlay" id="card-modal">
    <div class="card">
      <h2>Happy Birthday Ma'am Ladyanne! ✨</h2>
      <p>Wishing you a wonderful year ahead filled with happiness, peace, success, and endless sweet moments!</p>
      <button class="replay-btn" id="replay-btn">Light the Candles Again! 🕯️</button>
    </div>
  </div>

  <script>
    let isBlowingActive = false;

    window.addEventListener('DOMContentLoaded', () => {
      createBackgroundEffects();

      // Step 1: Base cake layer drops (2.0s)
      setTimeout(() => {
        document.getElementById('layer-base').classList.add('drop');
      }, 2000);

      // Step 2: Middle cake layer drops (3.5s)
      setTimeout(() => {
        document.getElementById('layer-middle').classList.add('drop');
      }, 3500);

      // Step 3: Top cake layer drops (5.0s)
      setTimeout(() => {
        document.getElementById('layer-top').classList.add('drop');
      }, 5000);

      // Step 4: Candle pops on top & instruction prompt fades in (6.5s)
      setTimeout(() => {
        addSprinkles();
        document.getElementById('decorations').classList.add('pop-in');
        document.getElementById('prompt').classList.add('visible');
        setupInteractivity();
      }, 6500);
    });

    // Background Effects Generator
    function createBackgroundEffects() {
      const container = document.getElementById('bg-effects');
      const colors = ['#bae6fd', '#38bdf8', '#fef08a', '#ffffff'];

      // Ambient Confetti Flakes
      for (let i = 0; i < 22; i++) {
        const flake = document.createElement('div');
        flake.className = 'bg-flake';
        const size = Math.random() * 6 + 4;
        flake.style.width = size + 'px';
        flake.style.height = size + 'px';
        flake.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        flake.style.left = Math.random() * 100 + 'vw';
        flake.style.animationDelay = Math.random() * 8 + 's';
        flake.style.animationDuration = Math.random() * 6 + 6 + 's';
        container.appendChild(flake);
      }

      // Side Fillers: Sparkles
      for (let i = 0; i < 12; i++) {
        const sparkle = document.createElement('div');
        sparkle.className = 'side-sparkle';
        const size = Math.random() * 8 + 6;
        sparkle.style.width = size + 'px';
        sparkle.style.height = size + 'px';
        const isLeft = Math.random() > 0.5;
        sparkle.style.left = isLeft ? (Math.random() * 20 + 2) + 'vw' : (Math.random() * 20 + 78) + 'vw';
        sparkle.style.top = (Math.random() * 50 + 20) + 'vh';
        sparkle.style.animationDelay = Math.random() * 4 + 's';
        sparkle.style.animationDuration = (Math.random() * 3 + 4) + 's';
        container.appendChild(sparkle);
      }

      // Side Fillers: Bokeh Circles
      for (let i = 0; i < 8; i++) {
        const bokeh = document.createElement('div');
        bokeh.className = 'side-bokeh';
        const size = Math.random() * 25 + 15;
        bokeh.style.width = size + 'px';
        bokeh.style.height = size + 'px';
        const isLeft = Math.random() > 0.5;
        bokeh.style.left = isLeft ? (Math.random() * 18 + 2) + 'vw' : (Math.random() * 18 + 80) + 'vw';
        bokeh.style.top = (Math.random() * 45 + 25) + 'vh';
        bokeh.style.animationDelay = Math.random() * 5 + 's';
        bokeh.style.animationDuration = (Math.random() * 4 + 7) + 's';
        container.appendChild(bokeh);
      }
    }

    // Sprinkle Generator for Top Cake Layer
    function addSprinkles() {
      const topLayer = document.getElementById('layer-top');
      const colors = ['#fef08a', '#eab308', '#bae6fd', '#38bdf8', '#ffffff'];
      for (let i = 0; i < 10; i++) {
        const sprinkle = document.createElement('div');
        sprinkle.className = 'sprinkle';
        sprinkle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        sprinkle.style.top = Math.random() * 14 + 10 + 'px';
        sprinkle.style.left = Math.random() * 70 + 8 + 'px';
        sprinkle.style.transform = `rotate(${Math.random() * 180}deg)`;
        topLayer.appendChild(sprinkle);
      }
    }

    // Interactivity Logic (Mouse & Mobile Touch Support)
    function setupInteractivity() {
      const flameContainer = document.getElementById('flame-container');
      const flame = document.getElementById('flame');
      const spark = document.getElementById('spark');
      const smoke = document.getElementById('smoke');
      const prompt = document.getElementById('prompt');
      const modal = document.getElementById('card-modal');
      const replayBtn = document.getElementById('replay-btn');

      isBlowingActive = true;

      const blowCandle = (e) => {
        if (e) e.preventDefault();
        if (!isBlowingActive) return;
        isBlowingActive = false;

        flame.style.display = 'none';
        smoke.classList.remove('puff');
        void smoke.offsetWidth;
        smoke.classList.add('puff');

        prompt.classList.remove('visible');

        launchConfetti();

        setTimeout(() => {
          modal.classList.add('active');
        }, 1200);
      };

      flameContainer.addEventListener('click', blowCandle);
      flameContainer.addEventListener('touchstart', blowCandle, { passive: false });

      const replayHandler = (e) => {
        if (e) e.preventDefault();
        modal.classList.remove('active');

        setTimeout(() => {
          spark.classList.remove('ignite');
          void spark.offsetWidth;
          spark.classList.add('ignite');

          flame.style.display = 'block';
          smoke.classList.remove('puff');

          prompt.classList.add('visible');
          isBlowingActive = true;
        }, 300);
      };

      replayBtn.addEventListener('click', replayHandler);
      replayBtn.addEventListener('touchstart', replayHandler, { passive: false });
    }

    // Confetti System
    function launchConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const particles = [];
      const colors = ['#0284c7', '#38bdf8', '#bae6fd', '#fef08a', '#eab308', '#ffffff'];

      for (let i = 0; i < 140; i++) {
        particles.push({
          x: canvas.width / 2,
          y: canvas.height / 2,
          vx: (Math.random() - 0.5) * 18,
          vy: (Math.random() - 0.7) * 18,
          size: Math.random() * 8 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          rotationSpeed: (Math.random() - 0.5) * 12
        });
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let activeParticles = 0;

        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.25;
          p.rotation += p.rotationSpeed;

          if (p.y < canvas.height + 20) {
            activeParticles++;
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate((p.rotation * Math.PI) / 180);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
            ctx.restore();
          }
        });

        if (activeParticles > 0) {
          requestAnimationFrame(animate);
        }
      }

      animate();
    }
  </script>
</body>
